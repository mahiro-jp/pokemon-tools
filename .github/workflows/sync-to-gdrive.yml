name: Repomix Multi-Sync to Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch: # GitHubのWeb画面から手動実行可能

jobs:
  repomix-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. 各設定ファイルごとにRepomixを実行して分割出力
      - name: Run Repomix for all modules
        run: |
          npx repomix --config repomix-configs/css.json
          npx repomix --config repomix-configs/data.json
          npx repomix --config repomix-configs/docs.json
          npx repomix --config repomix-configs/html.json
          npx repomix --config repomix-configs/images.json
          npx repomix --config repomix-configs/js.json

      # 2. アップロード用ライブラリのインストール
      - name: Install Google API Client
        run: |
          pip install google-api-python-client google-auth

      # 3. 指定したファイルIDへ直接上書き
      - name: Upload and Sync to Google Drive
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          ID_CSS: ${{ secrets.GDRIVE_FILE_ID_CSS }}
          ID_DATA: ${{ secrets.GDRIVE_FILE_ID_DATA }}
          ID_DOCS: ${{ secrets.GDRIVE_FILE_ID_DOCS }}
          ID_HTML: ${{ secrets.GDRIVE_FILE_ID_HTML }}
          ID_IMAGES: ${{ secrets.GDRIVE_FILE_ID_IMAGES }}
          ID_JS: ${{ secrets.GDRIVE_FILE_ID_JS }}
        run: |
          python - << 'EOF'
          import os
          import json
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          # 認証設定
          sa_info = json.loads(os.environ['GCP_SA_KEY'])
          creds = service_account.Credentials.from_service_account_info(
              sa_info,
              scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=creds)

          # ローカルの生成ファイルと、対象のDriveファイルIDの対応付け
          targets = [
              ('output-css.txt', os.environ.get('ID_CSS'), 'repomix-css.txt'),
              ('output-data.txt', os.environ.get('ID_DATA'), 'repomix-data.txt'),
              ('output-docs.txt', os.environ.get('ID_DOCS'), 'repomix-docs.txt'),
              ('output-html.txt', os.environ.get('ID_HTML'), 'repomix-html.txt'),
              ('output-images.txt', os.environ.get('ID_IMAGES'), 'repomix-images.txt'),
              ('output-js.txt', os.environ.get('ID_JS'), 'repomix-js.txt'),
          ]

          for local_file, file_id, label in targets:
              if not file_id:
                  print(f"Skip {label}: File ID not configured.")
                  continue
              if not os.path.exists(local_file):
                  print(f"Skip {label}: Local file {local_file} not found.")
                  continue

              print(f"Updating {label} (ID: {file_id})...")
              media = MediaFileUpload(local_file, mimetype='text/plain', resumable=True)
              
              # updateを実行
              updated = service.files().update(
                  fileId=file_id,
                  media_body=media
              ).execute()
              print(f"Success: Updated {label} (Size: {os.path.getsize(local_file)} bytes)")
          EOF