<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモン登録 - ポケモンツール</title>
    <link rel="stylesheet" href="../css/style.css">

    <!-- 描画前のダークモード高速判定（チラつき防止） -->
    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script src="../js/main.js" defer></script>

    <!-- Web Components コンポーネント定義 -->
    <script type="module" src="../js/components/app-header.js"></script>
    <script type="module" src="../js/components/app-footer.js"></script>
    <script type="module" src="../js/components/move-slot.js"></script>

    <!-- ポケモン登録画面ロジック -->
    <script type="module" src="../js/pokemon-registration.js"></script>

    <!-- PWA用のマニフェスト定義 -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#e3350d">

    <!-- iOS (Safari) 向けのインストール設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ポケツール">
    <link rel="apple-touch-icon" href="../images/icon-192.png">
</head>
<body>

    <app-header title="ポケモン登録" show-back="true" back-url="../index.html"></app-header>

    <main class="registration-main">
        <!-- 検索・ポケモン名入力エリア -->
        <section class="search-section">
            <div class="search-box">
                <input type="text" id="pokemon-name-input" placeholder="ポケモン名を入力... (例: ラグラージ)" list="pokemon-suggestions">
                <datalist id="pokemon-suggestions">
                    <!-- pokemons.json から動的に自動挿入されます -->
                </datalist>
                <button type="button" class="btn-primary" onclick="alert('検索ボタンがクリックされました');">検索</button>
            </div>
        </section>

        <!-- 2カラムレイアウト -->
        <div class="dashboard-grid">

            <!-- 左カラム: 基本情報・画像 -->
            <div class="dashboard-col left-col">
                <div class="card registration-card">
                    <h2 class="card-section-title">基本情報</h2>

                    <!-- 画像プレースホルダー -->
                    <div class="pokemon-image-placeholder">
                        <svg class="image-icon" viewBox="0 0 24 24">
                            <use href="../images/sprite.svg#logo"></use>
                        </svg>
                        <span class="image-text">No Image</span>
                    </div>

                    <div class="form-group-row">
                        <span class="form-label-inline">タイプ:</span>
                        <div class="type-badges">
                            <span class="badge badge-none">--</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="pokemon-nature">性格</label>
                        <select id="pokemon-nature" class="form-select">
                            <option value="まじめ" selected>まじめ (無補正)</option>
                            <option value="いじっぱり">いじっぱり (攻撃↑ 特攻↓)</option>
                            <option value="ひかえめ">ひかえめ (特攻↑ 攻撃↓)</option>
                            <option value="ようき">ようき (素早さ↑ 特攻↓)</option>
                            <option value="おくびょう">おくびょう (素早さ↑ 攻撃↓)</option>
                            <option value="わんぱく">わんぱく (防御↑ 特攻↓)</option>
                            <option value="ずぶとい">ずぶとい (防御↑ 攻撃↓)</option>
                            <option value="しんちょう">しんちょう (特防↑ 特攻↓)</option>
                            <option value="おだやか">おだやか (特防↑ 攻撃↓)</option>
                            <option value="さみしがり">さみしがり (攻撃↑ 防御↓)</option>
                            <option value="やんちゃ">やんちゃ (攻撃↑ 特防↓)</option>
                            <option value="おっとり">おっとり (特攻↑ 防御↓)</option>
                            <option value="うっかりや">うっかりや (特攻↑ 特防↓)</option>
                            <option value="のうてんき">のうてんき (防御↑ 特防↓)</option>
                            <option value="おとなしい">おとなしい (特防↑ 防御↓)</option>
                            <option value="せっかち">せっかち (素早さ↑ 防御↓)</option>
                            <option value="ゆうかん">ゆうかん (攻撃↑ 素早さ↓)</option>
                            <option value="のんき">のんき (防御↑ 素早さ↓)</option>
                            <option value="れいせい">れいせい (特攻↑ 素早さ↓)</option>
                            <option value="なまいき">なまいき (特防↑ 素早さ↓)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="pokemon-ability">特性</label>
                        <select id="pokemon-ability" class="form-select">
                            <option value="">特性を選択...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="pokemon-item">持ち物</label>
                        <select id="pokemon-item" class="form-select">
                            <option value="">持ち物を選択...</option>
                            <option value="きあいのタスキ">きあいのタスキ</option>
                            <option value="こだわりハチマキ">こだわりハチマキ</option>
                            <option value="こだわりメガネ">こだわりメガネ</option>
                            <option value="こだわりスカーフ">こだわりスカーフ</option>
                            <option value="とつげきチョッキ">とつげきチョッキ</option>
                            <option value="いのちのたま">いのちのたま</option>
                            <option value="たべのこし">たべのこし</option>
                            <option value="オボンのみ">オボンのみ</option>
                            <option value="ラムのみ">ラムのみ</option>
                            <option value="じゃくてんほけん">じゃくてんほけん</option>
                            <option value="おんみょえがさ">おんみょえがさ</option>
                            <option value="ブーストエナジー">ブーストエナジー</option>
                            <option value="ゴツゴツメット">ゴツゴツメット</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 右カラム: 能力ポイントと実数値 -->
            <div class="dashboard-col right-col">
                <div class="card registration-card">
                    <h2 class="card-section-title">能力ポイントと実数値 (Lv.50)</h2>

                    <div class="status-table-container">
                        <table class="status-table">
                            <thead>
                                <tr>
                                    <th>ステータス</th>
                                    <th>種族値</th>
                                    <th class="th-center">能力ポイント</th>
                                    <th></th>
                                    <th>実数値</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- HP -->
                                <tr>
                                    <td class="status-name">HP</td>
                                    <td class="status-base">--</td>
                                    <td class="status-ap-cell">
                                        <div class="ap-spinner">
                                            <button type="button" class="btn-ap-adjust">-</button>
                                            <input type="number" class="ap-input" value="0" min="0" max="32">
                                            <button type="button" class="btn-ap-adjust">+</button>
                                        </div>
                                    </td>
                                    <td class="ap-presets">
                                        <button type="button" class="btn-preset">0</button>
                                        <button type="button" class="btn-preset">32</button>
                                    </td>
                                    <td class="status-real highlight-value">--</td>
                                </tr>
                                <!-- 攻撃 -->
                                <tr>
                                    <td class="status-name">攻撃</td>
                                    <td class="status-base">--</td>
                                    <td class="status-ap-cell">
                                        <div class="ap-spinner">
                                            <button type="button" class="btn-ap-adjust">-</button>
                                            <input type="number" class="ap-input" value="0" min="0" max="32">
                                            <button type="button" class="btn-ap-adjust">+</button>
                                        </div>
                                    </td>
                                    <td class="ap-presets">
                                        <button type="button" class="btn-preset">0</button>
                                        <button type="button" class="btn-preset">32</button>
                                    </td>
                                    <td class="status-real">--</td>
                                </tr>
                                <!-- 防御 -->
                                <tr>
                                    <td class="status-name">防御</td>
                                    <td class="status-base">--</td>
                                    <td class="status-ap-cell">
                                        <div class="ap-spinner">
                                            <button type="button" class="btn-ap-adjust">-</button>
                                            <input type="number" class="ap-input" value="0" min="0" max="32">
                                            <button type="button" class="btn-ap-adjust">+</button>
                                        </div>
                                    </td>
                                    <td class="ap-presets">
                                        <button type="button" class="btn-preset">0</button>
                                        <button type="button" class="btn-preset">32</button>
                                    </td>
                                    <td class="status-real">--</td>
                                </tr>
                                <!-- 特攻 -->
                                <tr>
                                    <td class="status-name">特攻</td>
                                    <td class="status-base">--</td>
                                    <td class="status-ap-cell">
                                        <div class="ap-spinner">
                                            <button type="button" class="btn-ap-adjust">-</button>
                                            <input type="number" class="ap-input" value="0" min="0" max="32">
                                            <button type="button" class="btn-ap-adjust">+</button>
                                        </div>
                                    </td>
                                    <td class="ap-presets">
                                        <button type="button" class="btn-preset">0</button>
                                        <button type="button" class="btn-preset">32</button>
                                    </td>
                                    <td class="status-real">--</td>
                                </tr>
                                <!-- 特防 -->
                                <tr>
                                    <td class="status-name">特防</td>
                                    <td class="status-base">--</td>
                                    <td class="status-ap-cell">
                                        <div class="ap-spinner">
                                            <button type="button" class="btn-ap-adjust">-</button>
                                            <input type="number" class="ap-input" value="0" min="0" max="32">
                                            <button type="button" class="btn-ap-adjust">+</button>
                                        </div>
                                    </td>
                                    <td class="ap-presets">
                                        <button type="button" class="btn-preset">0</button>
                                        <button type="button" class="btn-preset">32</button>
                                    </td>
                                    <td class="status-real">--</td>
                                </tr>
                                <!-- 素早さ -->
                                <tr>
                                    <td class="status-name">素早さ</td>
                                    <td class="status-base">--</td>
                                    <td class="status-ap-cell">
                                        <div class="ap-spinner">
                                            <button type="button" class="btn-ap-adjust">-</button>
                                            <input type="number" class="ap-input" value="0" min="0" max="32">
                                            <button type="button" class="btn-ap-adjust">+</button>
                                        </div>
                                    </td>
                                    <td class="ap-presets">
                                        <button type="button" class="btn-preset">0</button>
                                        <button type="button" class="btn-preset">32</button>
                                    </td>
                                    <td class="status-real">--</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="ap-summary-box">
                        <span class="ap-summary-label">残り能力ポイント:</span>
                        <span class="ap-summary-value highlight-value">66 / 66</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- 下段: 技構成エリア (Web Component <move-slot> で動的生成) -->
        <section class="moves-section">
            <div class="card registration-card">
                <h2 class="card-section-title">技構成</h2>

                <div class="moves-grid">
                    <move-slot index="1"></move-slot>
                    <move-slot index="2"></move-slot>
                    <move-slot index="3"></move-slot>
                    <move-slot index="4"></move-slot>
                </div>
            </div>
        </section>

        <!-- 登録・削除アクション -->
        <div class="action-row">
            <button type="button" class="btn-danger" onclick="alert('削除ボタンがクリックされました（モック表示）');">削除</button>
            <button type="button" class="btn-success btn-large" onclick="alert('保存ボタンがクリックされました（モック表示）');">保存する</button>
        </div>

    </main>

    <app-footer></app-footer>

</body>
</html>
