<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="ポケモンチャンピオンズをサポートするツールです。">
    <meta name="theme-color" content="#f4f5f7">
    <title>ポケモンツール</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="ポケモンツール ホーム">
        <svg class="brand-icon" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="17" fill="white" stroke="currentColor" stroke-width="2.5"/>
          <path d="M3 20a17 17 0 0 1 34 0Z" fill="currentColor"/>
          <path d="M3 20a17 17 0 0 0 34 0Z" fill="white"/>
          <path d="M3.5 20h33" stroke="#1f2937" stroke-width="2.5"/>
          <circle cx="20" cy="20" r="5" fill="white" stroke="#1f2937" stroke-width="2.5"/>
        </svg>
        <span>ポケモンツール</span>
      </a>

      <nav class="primary-nav" aria-label="メインナビゲーション">
        <a href="#home" data-nav="home">ホーム</a>
        <a href="#pokemon" data-nav="pokemon">ポケモン登録</a>
        <a href="#party" data-nav="party">パーティ作成</a>
        <a href="#damage" data-nav="damage">ダメージ計算</a>
      </nav>
    </header>

    <main class="main-content">
      <section class="page home-page" id="page-home" data-page="home" aria-labelledby="welcome-title">
        <div class="welcome">
          <p class="eyebrow">POKÉMON CHAMPIONS TOOLKIT</p>
          <h1 id="welcome-title">ポケモンツール</h1>
          <p>ポケモンチャンピオンズをもっと楽しむためのツールです。<br class="desktop-break">使いたい機能のカードを選んでください。</p>
        </div>

        <div class="tool-grid" aria-label="ツール一覧">
          <a class="tool-card" href="#pokemon">
            <span class="card-icon ball-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48">
                <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="3"/>
                <path d="M6 24a18 18 0 0 1 36 0Z" fill="none"/>
                <path d="M6 24a18 18 0 0 0 36 0Z" fill="none"/>
                <path d="M6 24h36" stroke="currentColor" stroke-width="3"/>
                <circle cx="24" cy="24" r="5.5" fill="var(--soft-accent)" stroke="currentColor" stroke-width="3"/>
              </svg>
            </span>
            <span class="card-title">ポケモン登録</span>
            <span class="card-description">ポケモンのステータスや技構成などを登録します。</span>
            <span class="card-arrow" aria-hidden="true">→</span>
          </a>

          <a class="tool-card" href="#party">
            <span class="card-icon list-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" fill="none">
                <rect x="8" y="9" width="32" height="30" rx="5" stroke="currentColor" stroke-width="3"/>
                <path d="M17 18h15M17 24h15M17 30h9" stroke="currentColor" stroke-linecap="round" stroke-width="3"/>
                <circle cx="13" cy="18" r="1.5" fill="currentColor"/>
                <circle cx="13" cy="24" r="1.5" fill="currentColor"/>
                <circle cx="13" cy="30" r="1.5" fill="currentColor"/>
              </svg>
            </span>
            <span class="card-title">パーティ作成</span>
            <span class="card-description">登録したポケモンからパーティを作成します。</span>
            <span class="card-arrow" aria-hidden="true">→</span>
          </a>

          <a class="tool-card" href="#damage">
            <span class="card-icon calculator-icon" aria-hidden="true">
              <svg viewBox="0 0 48 48" fill="none">
                <rect x="11" y="6" width="26" height="36" rx="5" stroke="currentColor" stroke-width="3"/>
                <rect x="17" y="12" width="14" height="7" rx="1.5" stroke="currentColor" stroke-width="2.5"/>
                <path d="M18 26h2M24 26h2M30 26h.1M18 32h2M24 32h2M30 32h.1" stroke="currentColor" stroke-linecap="round" stroke-width="3.5"/>
              </svg>
            </span>
            <span class="card-title">ダメージ計算</span>
            <span class="card-description">技のダメージを計算し、結果を登録できます。</span>
            <span class="card-arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </section>

      <section class="page placeholder-page" id="page-pokemon" data-page="pokemon" aria-labelledby="pokemon-title" hidden>
        <div class="placeholder-card">
          <p class="eyebrow">TOOL</p>
          <h1 id="pokemon-title">ポケモン登録</h1>
          <a class="home-button" href="#home">ホームへ戻る</a>
        </div>
      </section>

      <section class="page placeholder-page" id="page-party" data-page="party" aria-labelledby="party-title" hidden>
        <div class="placeholder-card">
          <p class="eyebrow">TOOL</p>
          <h1 id="party-title">パーティ作成</h1>
          <a class="home-button" href="#home">ホームへ戻る</a>
        </div>
      </section>

      <section class="page placeholder-page" id="page-damage" data-page="damage" aria-labelledby="damage-title" hidden>
        <div class="placeholder-card">
          <p class="eyebrow">TOOL</p>
          <h1 id="damage-title">ダメージ計算</h1>
          <a class="home-button" href="#home">ホームへ戻る</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.6 8.6 0 1 0 20.2 15.3Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
          </svg>
          <span>ダークモード</span>
        </button>
        <div class="footer-actions" aria-label="ページ操作"></div>
      </div>
    </footer>
  </body>
</html>
