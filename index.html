<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンツール</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- 描画前のダークモード高速判定（チラつき防止） -->
    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script src="js/main.js" defer></script>

    <!-- Web Components コンポーネント定義 -->
    <script type="module" src="js/components/app-header.js"></script>
    <script type="module" src="js/components/app-footer.js"></script>

    <!-- PWA用のマニフェスト定義 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e3350d">

    <!-- iOS (Safari) 向けのインストール設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ポケツール">
    <link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body>

    <app-header title="ポケモンツール"></app-header>

    <main>
        <div class="intro">
            <p>ツールを選択してください。</p>
        </div>

        <div class="grid">
            <!-- ポケモン登録 -->
            <a href="html/pokemons.html" class="card">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24">
                        <use href="images/sprite.svg#icon-plus"></use>
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-title">ポケモン登録</span>
                    <span class="card-desc">ポケモンを登録・管理します。</span>
                </div>
            </a>

            <!-- パーティ作成 -->
            <a href="html/parties.html" class="card" onclick="event.preventDefault(); alert('パーティ作成画面（/parties）へ遷移します（モック）');">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24">
                        <use href="images/sprite.svg#icon-list"></use>
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-title">パーティ作成</span>
                    <span class="card-desc">対戦用のパーティを作成します。</span>
                </div>
            </a>

            <!-- ダメージ計算 -->
            <a href="html/damage-calculator.html" class="card" onclick="event.preventDefault(); alert('ダメージ計算画面（/damage-calculator）へ遷移します（モック）');">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24">
                        <use href="images/sprite.svg#icon-calculator"></use>
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-title">ダメージ計算</span>
                    <span class="card-desc">技のダメージや確定数を計算します。</span>
                </div>
            </a>
        </div>
    </main>

    <app-footer></app-footer>

</body>
</html>
