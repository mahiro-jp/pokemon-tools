<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンツール</title>
</head>
<body>

    <header>
        <div class="header-container">
            <!-- モンスターボール風のSVGアイコン -->
            <svg class="header-logo" viewBox="0 0 24 24">
                <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 19.9,11H16.1C15.6,9.3 14,8 12,8C10,8 8.4,9.3 7.9,11H4.1A8,8 0 0,1 12,4M12,20C8.1,20 4.9,16.9 4.1,13H7.9C8.4,14.7 10,16 12,16C14,16 15.6,14.7 16.1,13H19.9C19.1,16.9 15.9,20 12,20M12,10A2,2 0 0,0 10,12A2,2 0 0,0 12,14A2,2 0 0,0 14,12A2,2 0 0,0 12,10Z" />
            </svg>
            <h1>ポケモンツール</h1>
        </div>
        <link rel="stylesheet" href="css/style.css">
    </header>

    <main>
        <div class="intro">
            <p>ツールを選択してください。</p>
        </div>

        <div class="grid">
            <!-- ポケモン登録 -->
            <a href="/pokemons" class="card" onclick="event.preventDefault(); alert('ポケモン登録画面（/pokemons）へ遷移します（モック）');">
                <div class="card-icon">
                    <!-- プラスアイコン -->
                    <svg viewBox="0 0 24 24">
                        <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-title">ポケモン登録</span>
                    <span class="card-desc">お気に入りのポケモンを登録・管理します</span>
                </div>
            </a>

            <!-- パーティ作成 -->
            <a href="/parties" class="card" onclick="event.preventDefault(); alert('パーティ作成画面（/parties）へ遷移します（モック）');">
                <div class="card-icon">
                    <!-- リストアイコン -->
                    <svg viewBox="0 0 24 24">
                        <path d="M3,5H9V11H3V5M21,7V9H11V7H21M3,13H9V19H3V13M21,15V17H11V15H21Z" />
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-title">パーティ作成</span>
                    <span class="card-desc">対戦用の6匹のパーティを構築します</span>
                </div>
            </a>

            <!-- ダメージ計算 -->
            <a href="/damage-calculator" class="card" onclick="event.preventDefault(); alert('ダメージ計算画面（/damage-calculator）へ遷移します（モック）');">
                <div class="card-icon">
                    <!-- 計算機アイコン -->
                    <svg viewBox="0 0 24 24">
                        <path d="M7,2H17A2,2 0 0,1 19,4V20A2,2 0 0,1 17,22H7A2,2 0 0,1 5,20V4A2,2 0 0,1 7,2M7,4V8H17V4H7M7,10V12H9V10H7M11,10V12H13V10H11M15,10V12H17V10H15M7,14V16H9V14H7M11,14V16H13V14H11M15,14V16H17V14H15M7,18V20H9V18H7M11,18V20H13V18H11M15,18V20H17V18H15Z" />
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-title">ダメージ計算</span>
                    <span class="card-desc">技のダメージや確定数をシミュレートします</span>
                </div>
            </a>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <button class="btn-toggle" id="dark-mode-toggle">
                <!-- 月アイコン -->
                <svg class="icon-moon" viewBox="0 0 24 24">
                    <path d="M12,18C11.11,18 10.26,17.8 9.5,17.45C11.56,16.5 13,14.42 13,12C13,9.58 11.56,7.5 9.5,6.55C10.26,6.2 11.11,6 12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18M20,8.69V4H15.31L12,0.69L8.69,4H4V8.69L0.69,12L4,15.31V20H8.69L12,23.31L15.31,20H20V15.31L23.31,12L20,8.69Z" />
                </svg>
                <!-- 太陽アイコン -->
                <svg class="icon-sun" viewBox="0 0 24 24">
                    <path d="M12,18A6,6 0 1,1 18,12A6,6 0 0,1 12,18M20,15.31L23.31,12L20,8.69V4H15.31L12,0.69L8.69,4H4V8.69L0.69,12L4,15.31V20H8.69L12,23.31L15.31,20H20V15.31Z" />
                </svg>
                <span>ダークモード</span>
            </button>
        </div>
    </footer>

    <script>
        const toggleBtn = document.getElementById('dark-mode-toggle');
        const btnText = toggleBtn.querySelector('span');

        // システム設定やローカルストレージの優先読み込み
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            document.body.classList.add('dark-mode');
            btnText.textContent = 'ライトモード';
        }

        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            
            // ローカルストレージに保存
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            
            // ボタンテキストの切り替え
            btnText.textContent = isDark ? 'ライトモード' : 'ダークモード';
        });
    </script>
</body>
</html>
