<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンツール</title>
    <link rel="stylesheet" href="css/style.css">

    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDarkMode = savedTheme === 'dark' || (!savedTheme && systemPrefersDark);
        if (isDarkMode) {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <script src="js/main.js" defer></script>

    <!-- PWA用のマニフェスト定義 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e3350d">

    <!-- iOS (Safari) 向けのインストール設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ポケツール">
    <link rel="apple-touch-icon" href="images/icon-192.png">
</head>
<body>

    <header>
        <div class="header-container">
            <!-- モンスターボール風のSVGアイコン -->
            <svg class="header-logo" viewBox="0 0 24 24">
                <use href="images/sprite.svg#logo"></use>
            </svg>
            <h1>ポケモンツール</h1>
        </div>
    </header>

    <main>
        <div class="intro">
            <p>ツールを選択してください。</p>
        </div>

        <div class="grid">
            <!-- ポケモン登録 -->
            <a href="/pokemons" class="card" onclick="event.preventDefault(); alert('ポケモン登録画面（/pokemons）へ遷移します（モック）');">
                <div class="card-icon">
                    <!-- プラスアイコン -->
                    <svg viewBox="0 0 24 24">
                        <use href="images/sprite.svg#icon-plus"></use>
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-title">ポケモン登録</span>
                    <span class="card-desc">ポケモンを登録・管理します。</span>
                </div>
            </a>

            <!-- パーティ作成 -->
            <a href="/parties" class="card" onclick="event.preventDefault(); alert('パーティ作成画面（/parties）へ遷移します（モック）');">
                <div class="card-icon">
                    <!-- リストアイコン -->
                    <svg viewBox="0 0 24 24">
                        <use href="images/sprite.svg#icon-list"></use>
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-title">パーティ作成</span>
                    <span class="card-desc">対戦用のパーティを作成します。</span>
                </div>
            </a>

            <!-- ダメージ計算 -->
            <a href="/damage-calculator" class="card" onclick="event.preventDefault(); alert('ダメージ計算画面（/damage-calculator）へ遷移します（モック）');">
                <div class="card-icon">
                    <!-- 計算機アイコン -->
                    <svg viewBox="0 0 24 24">
                        <use href="images/sprite.svg#icon-calculator"></use>
                    </svg>
                </div>
                <div class="card-info">
                    <span class="card-title">ダメージ計算</span>
                    <span class="card-desc">技のダメージや確定数を計算します。</span>
                </div>
            </a>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <button class="btn-toggle" id="dark-mode-toggle">
                <!-- 月アイコン -->
                <svg class="icon-moon" viewBox="0 0 24 24">
                    <use href="images/sprite.svg#icon-moon"></use>
                </svg>
                <!-- 太陽アイコン -->
                <svg class="icon-sun" viewBox="0 0 24 24">
                    <use href="images/sprite.svg#icon-sun"></use>
                </svg>
                <span>ダークモード</span>
            </button>
        </div>
    </footer>

</body>
</html>
